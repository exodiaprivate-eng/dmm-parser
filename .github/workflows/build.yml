name: Build and Publish Wheels

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: true
        default: 'Deploy wheels'

permissions:
  contents: write

jobs:
  test:
    # Run the 475 lib unit tests on every push. These tests don't
    # require the game install — they validate the parser/serializer
    # logic against fixtures embedded in the source tree (per-table
    # roundtrips, BNK fixture, dispatch resolution, etc.). The bulk
    # round-trip validators that DO need the game install
    # (`tier1_full_roundtrip`, `mod_tooling_e2e`, `json_path_mod_e2e`)
    # run locally; their failure modes are captured in unit tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test --release --lib

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-gnu
          args: --release --out dist
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x64
          path: dist/*.whl

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Update develop release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.4.x
          name: Development Build
          body: |
            Latest development wheels built from `main`.
            Updated on each push.
          artifacts: dist/*.whl
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          makeLatest: false
